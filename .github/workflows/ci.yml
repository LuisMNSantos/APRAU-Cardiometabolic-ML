name: CI

# Runs on every pull request to master (no path filters: the checks are required to merge,
# so they must always report a status) and on every push to master.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install nbformat
        run: pip install nbformat==5.9.2
      - name: Notebook format, merge conflict markers and forbidden characters
        run: python .github/scripts/check_repo.py

  notebook:
    name: notebook
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Dataset (from the Entrega 1 zip, which already contains it)
        run: |
          unzip -o Entrega1/APRAU_DEN_D_1250534__1201816_1201270.zip notebooks/dataset_grupo_18.csv
          ls -l notebooks/dataset_grupo_18.csv
      - name: Restart & Run All
        working-directory: notebooks
        run: |
          start=$(date +%s)
          jupyter nbconvert --to notebook --execute aprau_grupo18.ipynb \
            --output aprau_grupo18_executado.ipynb --ExecutePreprocessor.timeout=-1
          echo "Tempo de execução: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-executado
          path: notebooks/aprau_grupo18_executado.ipynb
          if-no-files-found: ignore
          retention-days: 14
